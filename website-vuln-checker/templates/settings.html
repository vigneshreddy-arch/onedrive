{% extends 'base.html' %}

{% block title %}Settings{% endblock %}

{% block content %}
<div class="container">
    <div class="card">
        <h1>Settings</h1>
        <p>Update scan preferences, alert thresholds, and app behavior.</p>

        <div class="panel" style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:12px; padding:18px; margin-top:20px;">
            <p><strong>Risk threshold:</strong> 7/10</p>
            <p><strong>Auto-scan:</strong> Enabled</p>
            <p><strong>Report format:</strong> PDF + HTML</p>
        </div>
    </div>
</div>
{% endblock %}
